# Runs MyVGC and its Postgres database. Copy .env.example to .env first.
# Uses the published image; to build from source instead, add compose.build.yaml:
#   docker compose -f compose.yaml -f compose.build.yaml up --build
services:
  app:
    image: ghcr.io/jobanmendpara/myvgc:${MYVGC_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      ALLOW_SIGNUPS: ${ALLOW_SIGNUPS:-true}
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
