# On a version tag such as v0.1.0: run the smoke test, then build the image for amd64 and
# arm64 and publish it to GHCR as ghcr.io/jobanmendpara/myvgc:0.1.0 and :latest (ADR 15).
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  smoke:
    uses: ./.github/workflows/smoke.yml

  publish:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # v0.1.0 becomes 0.1.0, plus latest. Pre-releases (v0.2.0-rc.1) don't move latest.
          tags: |
            type=semver,pattern={{version}}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=MyVGC
            org.opencontainers.image.description=Track your Pokémon VGC tournaments, Teams and opponents in Pokémon Champions.
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
