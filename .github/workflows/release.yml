# On a version tag such as v0.1.0: run the smoke test, then build the image for amd64 and
# arm64 and publish it to GHCR as ghcr.io/jobanmendpara/myvgc:0.1.0 and :latest (ADR 15).
# Each platform builds on its own native runner and is pushed by digest; the publish job then
# combines the two into one multi-arch image under the version tags.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  smoke:
    uses: ./.github/workflows/smoke.yml

  build:
    needs: smoke
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Name the platform for caches and artifacts
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=MyVGC
            org.opencontainers.image.description=Track your Pokémon VGC tournaments, Teams and opponents in Pokémon Champions.
            org.opencontainers.image.licenses=AGPL-3.0-only

      # Pushed without a tag; the publish job tags the combined image.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max

      - name: Save the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # v0.1.0 becomes 0.1.0, plus latest. Pre-releases (v0.2.0-rc.1) don't move latest.
          tags: |
            type=semver,pattern={{version}}
          flavor: |
            latest=auto
          annotations: |
            org.opencontainers.image.title=MyVGC
            org.opencontainers.image.description=Track your Pokémon VGC tournaments, Teams and opponents in Pokémon Champions.
            org.opencontainers.image.licenses=AGPL-3.0-only
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index

      - name: Combine the platforms under the version tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "--tag=" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          mapfile -t annotations < <(jq -r '.annotations[] | "--annotation=" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create "${tags[@]}" "${annotations[@]}" $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect the image
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
